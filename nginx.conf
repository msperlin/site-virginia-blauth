server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/html application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # HTML sempre revalidado; o conteúdo muda quando o site é atualizado.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Fontes e imagens têm nome fixo, então podem ficar em cache longo.
    # Ao trocar um arquivo, renomeie-o (ou use versionamento por query string).
    location ~* \.(jpg|jpeg|png|webp|avif|svg|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
    }
}
